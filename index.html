<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>AH+ Gen AI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0A1A2F;  /* biru gelap */
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* full container */
    .agentic-container {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #0B1B33;
      color: #FFFFFF;
    }

    /* header minimalis (tanpa menyebut gemini/api key) */
    .agentic-header {
      padding: 1.2rem 1.8rem;
      background: rgba(8, 25, 48, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #1E3A5F;
      text-align: center;
    }

    .agentic-header h1 {
      font-size: 1.8rem;
      font-weight: 600;
      background: linear-gradient(120deg, #FFFFFF, #74B9FF);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
    }

    .agentic-header p {
      font-size: 0.75rem;
      color: #8DA3C0;
      margin-top: 0.2rem;
    }

    /* area chat */
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      scroll-behavior: smooth;
    }

    .message {
      display: flex;
      max-width: 85%;
      animation: fadeSlideUp 0.2s ease;
    }

    .user-message {
      align-self: flex-end;
    }

    .assistant-message {
      align-self: flex-start;
    }

    .bubble {
      padding: 0.8rem 1.2rem;
      border-radius: 1.5rem;
      font-size: 1rem;
      line-height: 1.45;
      background: #16273F;
      color: #F0F4FA;
      border: 1px solid #2C4A6E;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user-message .bubble {
      background: #1E4A76;
      border-bottom-right-radius: 0.3rem;
      border: 1px solid #3B82F6;
    }

    .assistant-message .bubble {
      border-bottom-left-radius: 0.3rem;
    }

    /* typing */
    .typing-indicator {
      background: #16273F;
      padding: 0.7rem 1.2rem;
      border-radius: 1.5rem;
      display: inline-flex;
      gap: 6px;
      border: 1px solid #2C4A6E;
    }
    .typing-indicator span {
      width: 8px;
      height: 8px;
      background: #74B9FF;
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out both;
    }
    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* panel input - desain full down */
    .input-panel {
      background: #07182E;
      border-top: 1px solid #1E3A5F;
      padding: 1rem 1.2rem 1.5rem;
    }

    /* ruang input utama lebih besar */
    .main-input-wrapper {
      background: #0F2742;
      border-radius: 60px;
      border: 1px solid #2C4A6E;
      display: flex;
      align-items: center;
      padding: 0.2rem 0.2rem 0.2rem 1.2rem;
      margin-bottom: 0.75rem;
    }
    .main-input-wrapper input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 1rem 0;
      font-size: 1rem;
      color: white;
      outline: none;
    }
    .main-input-wrapper input::placeholder {
      color: #5B7A9A;
      font-size: 0.95rem;
    }
    button {
      background: #2563EB;
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
      flex-shrink: 0;
    }
    button:active {
      transform: scale(0.94);
      background: #1D4ED8;
    }
    button svg {
      stroke: white;
      stroke-width: 2.2;
      width: 22px;
      height: 22px;
    }

    /* PIN field: kecil di bawah, shadow, tanpa label */
    .pin-field {
      width: 100%;
      display: flex;
      justify-content: flex-end;
    }
    .pin-field input {
      background: #0F2742;
      border: 1px solid #2C4A6E;
      border-radius: 40px;
      padding: 0.5rem 1rem;
      width: 180px;
      font-size: 0.75rem;
      font-family: monospace;
      color: #CCDDFF;
      text-align: center;
      outline: none;
      transition: 0.2s;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }
    .pin-field input:focus {
      border-color: #3B82F6;
      box-shadow: 0 0 0 2px rgba(59,130,246,0.3);
    }
    .pin-field input::placeholder {
      color: #5B7A9A;
      font-style: italic;
    }

    .status-text {
      margin-top: 8px;
      font-size: 0.7rem;
      color: #6A8BB0;
      text-align: right;
    }

    /* scroll */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #0F2742; }
    ::-webkit-scrollbar-thumb { background: #3B82F6; border-radius: 10px; }
  </style>
</head>
<body>
<div class="agentic-container">
  <div class="agentic-header">
    <h1>✦ AH+ Agentic AI</h1>
    <p>Generative Intelligence</p>
  </div>

  <div class="messages-area" id="messagesArea">
    <div class="message assistant-message">
      <div class="bubble">
        👋 I am AH+, Gen AI,entry your PIN and ask anything.
      </div>
    </div>
  </div>

  <div class="input-panel">
    <!-- Input utama yang besar -->
    <div class="main-input-wrapper">
      <input type="text" id="userInput" placeholder="Ask Anything ..." autocomplete="off">
      <button id="sendBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12l7-7 7 7"/>
        </svg>
      </button>
    </div>

    <!-- PIN field: hanya placeholder "entry your pin", tidak ada label api/gemini -->
    <div class="pin-field">
      <input type="password" id="pinInput" placeholder="entry your pin" autocomplete="off">
    </div>
    <div class="status-text" id="statusMsg">✅ Succes. PIN Entry to Start.</div>
  </div>
</div>

<script>
  // Elemen DOM
  const messagesArea = document.getElementById('messagesArea');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const pinInput = document.getElementById('pinInput');
  const statusSpan = document.getElementById('statusMsg');

  // Model tetap Gemini 2.5 Flash (tidak ada pilihan)
  const GEMINI_MODEL = "gemini-3.1-flash";

  // Load PIN dari localStorage (tanpa label apapun)
  let currentPin = localStorage.getItem('ahplus_pin') || '';
  if (currentPin) {
    pinInput.value = currentPin;
    updatePinStatus();
  } else {
    updatePinStatus();
  }

  // Simpan PIN otomatis saat diketik (tanpa perlu tombol simpan)
  pinInput.addEventListener('input', (e) => {
    const newPin = e.target.value.trim();
    if (newPin && newPin.startsWith('AIza')) {
      currentPin = newPin;
      localStorage.setItem('ahplus_pin', currentPin);
      updatePinStatus();
      statusSpan.innerHTML = '🔒 PIN tersimpan (valid). Sekarang bisa chat.';
      setTimeout(() => {
        if (!isWaiting) statusSpan.innerHTML = '✅ AH+ siap.';
      }, 1800);
    } else if (newPin === '') {
      localStorage.removeItem('ahplus_pin');
      currentPin = '';
      updatePinStatus();
      statusSpan.innerHTML = '⚠️ PIN kosong. Masukkan PIN Google AI Studio.';
    } else if (newPin && !newPin.startsWith('AIza')) {
      statusSpan.innerHTML = '⚠️ PIN harus diawali AIza... (Google API Key)';
    }
  });

  function updatePinStatus() {
    // tidak ada tampilan teks "API Key" di header, hanya internal
    // biarkan status di pojok kanan bawah tetap informatif.
    if (currentPin && currentPin.startsWith('AIza')) {
      // status sudah diatur lewat statusSpan
    }
  }

  let isWaiting = false;

  function appendMessage(role, content, isError = false) {
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${role === 'user' ? 'user-message' : 'assistant-message'}`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (isError) bubble.style.background = '#3B1E1E';
    bubble.innerHTML = content.replace(/\n/g, '<br>');
    messageDiv.appendChild(bubble);
    messagesArea.appendChild(messageDiv);
    messagesArea.scrollTop = messagesArea.scrollHeight;
  }

  let loadingDiv = null;
  function showTyping() {
    if (loadingDiv) loadingDiv.remove();
    loadingDiv = document.createElement('div');
    loadingDiv.className = 'message assistant-message';
    loadingDiv.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
    messagesArea.appendChild(loadingDiv);
    messagesArea.scrollTop = messagesArea.scrollHeight;
  }
  function hideTyping() {
    if (loadingDiv) { loadingDiv.remove(); loadingDiv = null; }
  }

  // Panggil Gemini API
  async function callGemini(userMessage, pin) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${pin}`;
    const requestBody = {
      contents: [{ parts: [{ text: userMessage }] }],
      generationConfig: { temperature: 0.7, maxOutputTokens: 2048 }
    };
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(requestBody)
    });
    if (!response.ok) {
      let errorDetail = `HTTP ${response.status}`;
      try {
        const errJson = await response.json();
        errorDetail = errJson.error?.message || JSON.stringify(errJson);
      } catch(e) {}
      throw new Error(`Gemini error ${response.status}: ${errorDetail}`);
    }
    const data = await response.json();
    if (!data?.candidates?.[0]?.content?.parts?.[0]?.text) {
      throw new Error('Respons tidak valid');
    }
    return data.candidates[0].content.parts[0].text;
  }

  async function sendMessage() {
    const message = userInput.value.trim();
    if (!message) return;

    if (!currentPin || !currentPin.startsWith('AIza')) {
      statusSpan.innerHTML = "❌ PIN belum valid. Masukkan PIN Google AI Studio (diawali AIza...).";
      return;
    }

    appendMessage('user', message);
    userInput.value = '';
    userInput.focus();
    isWaiting = true;
    statusSpan.innerText = "🧠 AH+...";
    showTyping();

    try {
      const reply = await callGemini(message, currentPin);
      hideTyping();
      appendMessage('assistant', reply);
      statusSpan.innerText = "✅ Balasan dari AH+";
    } catch (err) {
      console.error(err);
      hideTyping();
      let errorMsg = err.message;
      if (errorMsg.includes('403')) errorMsg = 'PIN salah atau kuota habis. Periksa kembali PIN (Google API Key).';
      if (errorMsg.includes('404')) errorMsg = 'Model tidak tersedia. Hubungi admin.';
      appendMessage('assistant', `⚠️ Gagal: ${errorMsg}`, true);
      statusSpan.innerText = "❌ Error. Cek PIN atau jaringan.";
    } finally {
      isWaiting = false;
    }
  }

  // Event: enter pada input utama
  userInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && !isWaiting) sendMessage();
  });
  sendBtn.addEventListener('click', sendMessage);

  // fokus ke input utama
  userInput.focus();
</script>
</body>
</html>
