<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>AH+ · Smart Agent (BYOK)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #0A0F1E 0%, #0C1222 100%);
      font-family: 'Segoe UI', system-ui, -apple-system, 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Container Utama */
    .app-container {
      max-width: 1000px;
      width: 100%;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(12px);
      border-radius: 2rem;
      box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(56, 189, 248, 0.2);
      overflow: hidden;
    }

    /* Header */
    .chat-header {
      padding: 1rem 1.5rem;
      background: rgba(10, 16, 30, 0.85);
      border-bottom: 1px solid rgba(56, 189, 248, 0.25);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .title-section h1 {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(120deg, #E0F2FE, #67e8f9);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }
    .api-status {
      font-size: 0.75rem;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      background: #1E293B;
      color: #94A3B8;
    }
    .api-status.valid {
      background: #14532D;
      color: #86EFAC;
    }

    /* Area Chat */
    .messages-area {
      height: 420px;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background: rgba(2, 6, 23, 0.4);
    }
    .message {
      display: flex;
      max-width: 85%;
      animation: fadeSlideUp 0.2s ease;
    }
    .user-message { align-self: flex-end; }
    .assistant-message { align-self: flex-start; }
    .bubble {
      padding: 0.75rem 1.2rem;
      border-radius: 1.5rem;
      font-size: 0.95rem;
      line-height: 1.45;
      background: #111827;
      color: #E2E8F0;
      border: 1px solid #2D3748;
    }
    .user-message .bubble {
      background: #1E2A47;
      border-bottom-right-radius: 0.3rem;
    }
    .assistant-message .bubble {
      border-bottom-left-radius: 0.3rem;
    }

    /* Panel Input & Kontrol */
    .input-panel {
      padding: 1rem 1.2rem 1.5rem;
      background: #0F172A;
      border-top: 1px solid #1E293B;
    }
    .api-key-section {
      display: flex;
      gap: 10px;
      margin-bottom: 1rem;
      background: #0A0F1F;
      padding: 0.6rem;
      border-radius: 60px;
      border: 1px solid #2D3A60;
    }
    .api-key-section input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 0.6rem 1rem;
      color: white;
      font-size: 0.85rem;
      font-family: monospace;
      outline: none;
    }
    .api-key-section button {
      background: #2563EB;
      border: none;
      padding: 0.4rem 1.2rem;
      border-radius: 40px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .model-selector {
      margin-bottom: 1rem;
      display: flex;
      justify-content: flex-end;
    }
    select {
      background: #1E293B;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 40px;
      color: #BAE6FD;
      font-size: 0.8rem;
    }
    .input-group {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .input-group input {
      flex: 1;
      background: #0A0F1F;
      border: 1px solid #2D3A60;
      padding: 0.8rem 1.2rem;
      border-radius: 3rem;
      color: white;
      outline: none;
    }
    .input-group button {
      background: #2563EB;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 3rem;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .status-text {
      margin-top: 10px;
      font-size: 0.7rem;
      color: #64748B;
      text-align: right;
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="chat-header">
    <div class="title-section"><h1>✦ AH+ (BYOK)</h1></div>
    <div class="api-status" id="apiStatusLabel">🔑 API Key: Belum diset</div>
  </div>

  <div class="messages-area" id="messagesArea">
    <div class="message assistant-message">
      <div class="bubble">👋 Halo! Saya AH+.<br><br>Silakan masukkan <strong>API Key OpenRouter</strong> Anda di panel bawah, lalu pilih model dan mulai chat. Key Anda aman dan hanya tersimpan di browser ini.</div>
    </div>
  </div>

  <div class="input-panel">
    <div class="api-key-section">
      <input type="password" id="apiKeyInput" placeholder="Masukkan API Key OpenRouter Anda (contoh: sk-or-v1-...)" autocomplete="off">
      <button id="saveKeyBtn">Simpan Key</button>
    </div>

    <div class="model-selector">
      <select id="modelSelect">
        <option value="qwen/qwen3.6-plus-preview:free">⚡ Qwen 3.6 Plus (1M ctx)</option>
        <option value="openrouter/elephant-alpha:free">🐘 Elephant Alpha (Best Allround)</option>
        <option value="google/gemini-2.5-flash-preview:free">✨ Gemini 2.5 Flash</option>
        <option value="xai/grok-4-fast:free">⚡ Grok 4 Fast</option>
      </select>
    </div>

    <div class="input-group">
      <input type="text" id="userInput" placeholder="Ketik pesan Anda di sini..." autocomplete="off">
      <button id="sendBtn">📤 Kirim</button>
    </div>
    <div class="status-text" id="statusMsg">✅ Siap. Simpan API Key untuk memulai chat.</div>
  </div>
</div>

<script>
  // --- Elemen DOM ---
  const messagesArea = document.getElementById('messagesArea');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const modelSelect = document.getElementById('modelSelect');
  const apiKeyInput = document.getElementById('apiKeyInput');
  const saveKeyBtn = document.getElementById('saveKeyBtn');
  const apiStatusLabel = document.getElementById('apiStatusLabel');
  const statusSpan = document.getElementById('statusMsg');

  let currentApiKey = localStorage.getItem('openrouter_api_key') || '';
  let isWaiting = false;

  // --- Fungsi Update UI ---
  function updateApiKeyStatus() {
    if (currentApiKey && currentApiKey.startsWith('sk-or-v1-')) {
      apiStatusLabel.innerText = '🔒 API Key: Tersimpan (Valid)';
      apiStatusLabel.className = 'api-status valid';
      statusSpan.innerHTML = '🔑 API Key aktif. Pilih model dan mulai chat.';
    } else {
      apiStatusLabel.innerText = '⚠️ API Key: Belum diset / tidak valid';
      apiStatusLabel.className = 'api-status';
      statusSpan.innerHTML = '⚠️ Masukkan API Key OpenRouter yang valid (diawali sk-or-v1-).';
    }
  }

  // --- Simpan API Key ---
  saveKeyBtn.addEventListener('click', () => {
    const newKey = apiKeyInput.value.trim();
    if (newKey && newKey.startsWith('sk-or-v1-')) {
      currentApiKey = newKey;
      localStorage.setItem('openrouter_api_key', currentApiKey);
      updateApiKeyStatus();
      apiKeyInput.value = '';
      statusSpan.innerHTML = '✅ API Key berhasil disimpan secara lokal.';
      setTimeout(() => { if (!isWaiting) statusSpan.innerHTML = '✅ Siap bicara dengan AH+.'; }, 2000);
    } else {
      statusSpan.innerHTML = '❌ API Key tidak valid. Pastikan formatnya benar (sk-or-v1-...).';
    }
  });

  // --- Tambah Pesan ke Chat ---
  function appendMessage(role, content, isError = false) {
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${role === 'user' ? 'user-message' : 'assistant-message'}`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (isError) bubble.style.background = '#330f0f';
    bubble.innerHTML = content.replace(/\n/g, '<br>');
    messageDiv.appendChild(bubble);
    messagesArea.appendChild(messageDiv);
    messagesArea.scrollTop = messagesArea.scrollHeight;
    return messageDiv;
  }

  // --- Loading Indicator ---
  let loadingDiv = null;
  function showTyping() {
    if (loadingDiv) loadingDiv.remove();
    loadingDiv = document.createElement('div');
    loadingDiv.className = 'message assistant-message';
    loadingDiv.innerHTML = `<div class="bubble" style="background:#1E293B;">🤔 AH+ sedang mengetik...</div>`;
    messagesArea.appendChild(loadingDiv);
    messagesArea.scrollTop = messagesArea.scrollHeight;
  }
  function hideTyping() {
    if (loadingDiv) { loadingDiv.remove(); loadingDiv = null; }
  }

  // --- Fungsi Panggil OpenRouter API ---
  async function callOpenRouter(modelId, userMessage, apiKey) {
    const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${apiKey}`,
        "Content-Type": "application/json",
        "HTTP-Referer": window.location.href,
        "X-Title": "AH+ Agent"
      },
      body: JSON.stringify({
        model: modelId,
        messages: [
          { role: "system", content: "Anda adalah AH+, asisten AI yang cerdas dan ramah. Gunakan bahasa Indonesia." },
          { role: "user", content: userMessage }
        ],
        temperature: 0.7,
        max_tokens: 1800
      })
    });

    if (!response.ok) {
      let errorDetail = `HTTP ${response.status}`;
      try {
        const errJson = await response.json();
        errorDetail = errJson.error?.message || JSON.stringify(errJson);
      } catch(e) {}
      throw new Error(`API error ${response.status}: ${errorDetail}`);
    }
    const data = await response.json();
    if (!data?.choices?.[0]?.message?.content) throw new Error("Respon tidak valid dari OpenRouter");
    return data.choices[0].message.content;
  }

  // --- Kirim Pesan ---
  async function sendMessage() {
    if (isWaiting) {
      statusSpan.innerText = "⏳ Tunggu, AH+ masih memproses...";
      return;
    }

    const message = userInput.value.trim();
    if (!message) return;

    // Validasi API Key sebelum kirim
    if (!currentApiKey || !currentApiKey.startsWith('sk-or-v1-')) {
      statusSpan.innerHTML = "❌ API Key belum disimpan atau tidak valid. Masukkan key Anda terlebih dahulu.";
      return;
    }

    appendMessage('user', message);
    userInput.value = '';
    userInput.focus();
    isWaiting = true;
    statusSpan.innerText = "🧠 AH+ sedang berpikir...";

    const selectedModel = modelSelect.value;
    showTyping();

    try {
      const reply = await callOpenRouter(selectedModel, message, currentApiKey);
      hideTyping();
      appendMessage('assistant', reply);
      statusSpan.innerText = `✅ Respon dari ${selectedModel.split('/').pop()}`;
    } catch (err) {
      console.error(err);
      hideTyping();
      appendMessage('assistant', `⚠️ Gagal memanggil AI: ${err.message}.`, true);
      statusSpan.innerText = "❌ Error panggil API — periksa API Key atau pilih model lain.";
    } finally {
      isWaiting = false;
    }
  }

  // --- Event Listener ---
  sendBtn.addEventListener('click', sendMessage);
  userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter' && !isWaiting) sendMessage(); });

  // Load API Key dari localStorage saat halaman dimuat
  if (currentApiKey) {
    updateApiKeyStatus();
  } else {
    updateApiKeyStatus();
  }
</script>
</body>
</html>
