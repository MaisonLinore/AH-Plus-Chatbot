<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>AH+ · Gemini AI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0F0F13;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Full-screen chat container */
    .chat-container {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #0A0A0E;
      color: #E8E8F0;
    }

    /* Header */
    .chat-header {
      padding: 1rem 1.5rem;
      background: rgba(18, 18, 24, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #2A2A35;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .title-section {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      background: linear-gradient(135deg, #FFFFFF 0%, #60A5FA 100%);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: -0.3px;
    }

    .badge {
      background: rgba(96, 165, 250, 0.15);
      border-radius: 100px;
      padding: 0.25rem 0.9rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: #93C5FD;
      border: 0.5px solid rgba(96, 165, 250, 0.4);
    }

    /* Status area */
    .api-status {
      font-size: 0.75rem;
      background: #1E1E2A;
      padding: 0.25rem 0.9rem;
      border-radius: 20px;
      color: #A1A1B0;
    }

    /* Chat messages area */
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      scroll-behavior: smooth;
    }

    /* Message bubbles */
    .message {
      display: flex;
      max-width: 85%;
      animation: fadeSlideUp 0.25s ease;
    }

    .user-message {
      align-self: flex-end;
    }

    .assistant-message {
      align-self: flex-start;
    }

    .bubble {
      padding: 0.75rem 1.2rem;
      border-radius: 1.5rem;
      font-size: 0.95rem;
      line-height: 1.5;
      background: #18181F;
      color: #E8E8F0;
      border: 1px solid #2D2D3A;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user-message .bubble {
      background: #1E3A8A;
      border-bottom-right-radius: 0.3rem;
      border: 1px solid #3B82F6;
    }

    .assistant-message .bubble {
      border-bottom-left-radius: 0.3rem;
    }

    /* Typing indicator */
    .typing-indicator {
      background: #18181F;
      padding: 0.75rem 1.2rem;
      border-radius: 1.5rem;
      display: inline-flex;
      gap: 6px;
      align-items: center;
      border: 1px solid #2D2D3A;
    }

    .typing-indicator span {
      width: 8px;
      height: 8px;
      background: #60A5FA;
      border-radius: 50%;
      display: inline-block;
      animation: bounce 1.2s infinite ease-in-out both;
    }

    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Input panel */
    .input-panel {
      background: #0F0F14;
      border-top: 1px solid #2A2A35;
      padding: 1rem 1.2rem 1.3rem;
    }

    /* API Key row */
    .api-row {
      display: flex;
      gap: 12px;
      margin-bottom: 1rem;
      background: #18181F;
      border-radius: 60px;
      padding: 0.3rem 0.3rem 0.3rem 1.2rem;
      border: 1px solid #2D2D3A;
    }

    .api-row input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 0.7rem 0;
      color: #E8E8F0;
      font-size: 0.85rem;
      font-family: monospace;
      outline: none;
    }

    .api-row input::placeholder {
      color: #5E5E72;
      font-family: monospace;
    }

    /* Model selector & send row */
    .action-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .model-select-wrapper {
      background: #18181F;
      border-radius: 40px;
      border: 1px solid #2D2D3A;
      padding: 0 0.75rem;
    }

    select {
      background: transparent;
      border: none;
      padding: 0.7rem 0.5rem;
      color: #93C5FD;
      font-size: 0.85rem;
      font-weight: 500;
      outline: none;
      cursor: pointer;
    }

    .input-wrapper {
      flex: 1;
      background: #18181F;
      border-radius: 60px;
      border: 1px solid #2D2D3A;
      display: flex;
      align-items: center;
      padding: 0.1rem 0.1rem 0.1rem 1.2rem;
    }

    .input-wrapper input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 0.8rem 0;
      color: #E8E8F0;
      font-size: 0.95rem;
      outline: none;
    }

    button {
      background: #2563EB;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    button:active {
      transform: scale(0.94);
      background: #1D4ED8;
    }

    button svg {
      stroke: white;
      stroke-width: 2.2;
      width: 20px;
      height: 20px;
    }

    .status-text {
      margin-top: 8px;
      font-size: 0.7rem;
      color: #6B6B84;
      text-align: right;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #1E1E2A; }
    ::-webkit-scrollbar-thumb { background: #3B82F6; border-radius: 10px; }
  </style>
</head>
<body>
<div class="chat-container">
  <div class="chat-header">
    <div class="title-section">
      <h1>✦ AH+</h1>
      <div class="badge">Gen AI · Gemini</div>
    </div>
    <div class="api-status" id="apiStatusLabel">🔑 API Key: Belum diset</div>
  </div>

  <div class="messages-area" id="messagesArea">
    <div class="message assistant-message">
      <div class="bubble">
        👋 Halo! Saya <strong>AH+</strong>.<br><br>
        Silakan masukkan <strong>Google API Key</strong> kamu di kolom bawah, pilih model Gemini, lalu mulai chat.
        <br><br>🔒 API Key akan tersimpan aman di browser kamu.
      </div>
    </div>
  </div>

  <div class="input-panel">
    <div class="api-row">
      <input type="password" id="apiKeyInput" placeholder="Masukkan GOOGLE_API_KEY (contoh: AIzaSy...)" autocomplete="off">
    </div>
    <div class="action-row">
      <div class="model-select-wrapper">
        <select id="modelSelect">
          <option value="gemini-2.5-flash-preview-09-2025">✨ Gemini 2.5 Flash (default)</option>
          <option value="gemini-2.0-flash">⚡ Gemini 2.0 Flash</option>
        </select>
      </div>
      <div class="input-wrapper">
        <input type="text" id="userInput" placeholder="Ketik pesan ke AH+..." autocomplete="off">
      </div>
      <button id="sendBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12l7-7 7 7"/>
        </svg>
      </button>
    </div>
    <div class="status-text" id="statusMsg">✅ Siap. Masukkan Google API Key untuk memulai.</div>
  </div>
</div>

<script>
  // --- DOM Elements ---
  const messagesArea = document.getElementById('messagesArea');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const modelSelect = document.getElementById('modelSelect');
  const apiKeyInput = document.getElementById('apiKeyInput');
  const apiStatusLabel = document.getElementById('apiStatusLabel');
  const statusSpan = document.getElementById('statusMsg');

  // Load API key from localStorage on startup
  let currentApiKey = localStorage.getItem('google_api_key') || '';
  if (currentApiKey) {
    apiKeyInput.value = currentApiKey;
    updateApiKeyStatus();
  } else {
    updateApiKeyStatus();
  }

  // Auto-save API key when user types
  apiKeyInput.addEventListener('input', (e) => {
    const newKey = e.target.value.trim();
    if (newKey && newKey.startsWith('AIza')) {
      currentApiKey = newKey;
      localStorage.setItem('google_api_key', currentApiKey);
      updateApiKeyStatus();
      statusSpan.innerHTML = '✅ Google API Key tersimpan secara lokal.';
      setTimeout(() => {
        if (!isWaiting) statusSpan.innerHTML = '✅ Siap bicara dengan AH+.';
      }, 2000);
    } else if (newKey === '') {
      localStorage.removeItem('google_api_key');
      currentApiKey = '';
      updateApiKeyStatus();
      statusSpan.innerHTML = '⚠️ API Key dihapus. Masukkan key untuk chat.';
    } else if (newKey && !newKey.startsWith('AIza')) {
      statusSpan.innerHTML = '⚠️ Format Google API Key harus diawali AIza...';
    }
  });

  function updateApiKeyStatus() {
    if (currentApiKey && currentApiKey.startsWith('AIza')) {
      apiStatusLabel.innerText = '🔒 API Key: Tersimpan (Google)';
      apiStatusLabel.style.background = '#14532D';
      apiStatusLabel.style.color = '#86EFAC';
    } else {
      apiStatusLabel.innerText = '⚠️ API Key: Belum diset / tidak valid';
      apiStatusLabel.style.background = '#1E1E2A';
      apiStatusLabel.style.color = '#A1A1B0';
    }
  }

  let isWaiting = false;

  // --- Helper: Add message to UI ---
  function appendMessage(role, content, isError = false) {
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${role === 'user' ? 'user-message' : 'assistant-message'}`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (isError) bubble.style.background = '#3B1E1E';
    bubble.innerHTML = content.replace(/\n/g, '<br>');
    messageDiv.appendChild(bubble);
    messagesArea.appendChild(messageDiv);
    messagesArea.scrollTop = messagesArea.scrollHeight;
  }

  let loadingDiv = null;
  function showTyping() {
    if (loadingDiv) loadingDiv.remove();
    loadingDiv = document.createElement('div');
    loadingDiv.className = 'message assistant-message';
    loadingDiv.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
    messagesArea.appendChild(loadingDiv);
    messagesArea.scrollTop = messagesArea.scrollHeight;
  }
  function hideTyping() {
    if (loadingDiv) { loadingDiv.remove(); loadingDiv = null; }
  }

  // --- Call Google Gemini API (direct fetch) ---
  async function callGemini(modelId, userMessage, apiKey) {
    // Gemini API endpoint: https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={API_KEY}
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelId}:generateContent?key=${apiKey}`;
    
    const requestBody = {
      contents: [{
        parts: [{ text: userMessage }]
      }],
      generationConfig: {
        temperature: 0.7,
        maxOutputTokens: 2048,
      }
    };

    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(requestBody)
    });

    if (!response.ok) {
      let errorDetail = `HTTP ${response.status}`;
      try {
        const errJson = await response.json();
        errorDetail = errJson.error?.message || JSON.stringify(errJson);
      } catch(e) {}
      throw new Error(`Gemini API error ${response.status}: ${errorDetail}`);
    }
    const data = await response.json();
    if (!data?.candidates?.[0]?.content?.parts?.[0]?.text) {
      throw new Error('Respons tidak valid dari Gemini API');
    }
    return data.candidates[0].content.parts[0].text;
  }

  // --- Send message handler ---
  async function sendMessage() {
    const message = userInput.value.trim();
    if (!message) return;

    if (!currentApiKey || !currentApiKey.startsWith('AIza')) {
      statusSpan.innerHTML = "❌ Masukkan Google API Key yang valid (awalan AIza...). Dapatkan dari Google AI Studio.";
      return;
    }

    appendMessage('user', message);
    userInput.value = '';
    userInput.focus();
    isWaiting = true;
    statusSpan.innerText = "🧠 AH+ sedang memproses...";

    const selectedModel = modelSelect.value;
    showTyping();

    try {
      const reply = await callGemini(selectedModel, message, currentApiKey);
      hideTyping();
      appendMessage('assistant', reply);
      statusSpan.innerText = `✅ Respon dari ${selectedModel}`;
    } catch (err) {
      console.error(err);
      hideTyping();
      let errorMsg = err.message;
      if (errorMsg.includes('403')) errorMsg = 'API Key tidak valid atau kuota habis. Periksa kembali Google API Key.';
      if (errorMsg.includes('404')) errorMsg = 'Model tidak tersedia. Pilih model lain.';
      appendMessage('assistant', `⚠️ Gagal: ${errorMsg}`, true);
      statusSpan.innerText = "❌ Error. Cek Google API Key atau pilih model lain.";
    } finally {
      isWaiting = false;
    }
  }

  // --- Event listeners ---
  sendBtn.addEventListener('click', sendMessage);
  userInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && !isWaiting) sendMessage();
  });
</script>
</body>
</html>
